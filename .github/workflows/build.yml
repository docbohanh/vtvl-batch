name: Build VTVL Batch

# Dựng bản cài đặt cho Windows và macOS. Chạy tay (Actions → Run workflow) hoặc khi đẩy thẻ v*.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Khi đẩy thẻ v*: số phiên bản trong ứng dụng phải khớp thẻ, nếu không chức năng "Kiểm tra cập nhật" sẽ báo sai.
  kiem-tra-phien-ban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Thẻ phải khớp phiên bản trong tauri.conf.json và Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          the="${GITHUB_REF_NAME#v}"
          the="${the%%-*}"
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "thẻ=$the tauri.conf=$conf Cargo=$cargo"
          if [ "$the" != "$conf" ] || [ "$the" != "$cargo" ]; then
            echo "::error::Thẻ $GITHUB_REF_NAME không khớp phiên bản trong tauri.conf.json ($conf) hoặc Cargo.toml ($cargo). Sửa rồi đẩy lại thẻ."
            exit 1
          fi

  build:
    needs: kiem-tra-phien-ban
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            nhan: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            nhan: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            nhan: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vtvl-batch-${{ matrix.nhan }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
          if-no-files-found: error

  # Gói đi kèm: tập lệnh kiểm tra tệp Excel và cấu hình mẫu (ứng dụng đọc scripts/ và config/ cạnh thư mục data/).
  di-kem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - run: |
          mkdir -p goi
          mkdir -p goi/config
          cp -r scripts goi/scripts
          cp config/lo.example.json goi/config/
          cp -r node_modules goi/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: vtvl-batch-di-kem
          path: goi

  # Chỉ khi cả bản cài đặt lẫn gói đi kèm dựng xong và run được kích hoạt bằng thẻ v*: tạo Release và đính kèm tệp.
  phat-hanh:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, di-kem]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: tep
      - name: Nén gói đi kèm
        run: cd tep/vtvl-batch-di-kem && zip -qr ../vtvl-batch-di-kem.zip .
      - name: Tạo Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Tên tệp cài đặt có dấu cách ("VTVL Batch_x.y.z_x64-setup.exe"): đọc vào mảng theo ký tự NUL, không để shell tách từ.
          mapfile -d '' cua_so < <(find tep -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name 'vtvl-batch-di-kem.zip' \) -print0)
          [ "${#cua_so[@]}" -gt 0 ] || { echo "::error::Không có tệp nào để đính kèm"; exit 1; }
          printf 'Đính kèm: %s\n' "${cua_so[@]}"
          gh release create "$GITHUB_REF_NAME" "${cua_so[@]}" --title "VTVL Batch $GITHUB_REF_NAME" --generate-notes
